// ── CORE CALCULATION ──
// BTC: hashrate in TH/s → multiply by 1e12 to get H/s
// LTC: hashrate in GH/s → multiply by 1e9 to get H/s
function doCalc(m, qty, elec, prices, wtm, pool, upt, infra) {
if (!m || qty<=0) return null;
const {btcP, ltcP, dogeP} = prices;
const isBTC = m.algo==='BTC';
const pwrKW = (m.watts/1000) * qty;
const eCost = pwrKW * 24 * elec * (upt/100);

let revenue=0, coinDay=0;

if (isBTC) {
// TH/s → H/s = multiply by 1e12
const hashHS = m.hashrate * qty * 1e12;
if (wtm.btc && wtm.btc.nethash > 0) {
coinDay = (hashHS * 86400 * wtm.btc.block_reward) / (wtm.btc.nethash * wtm.btc.block_time);
} else {
// fallback: standard formula at ~981 EH/s
coinDay = (m.hashrate * qty / 981e6) * 3.125 * 144;
}
revenue = coinDay * btcP * (1-pool/100) * (upt/100);
} else {
// GH/s → H/s = multiply by 1e9
const hashHS = m.hashrate * qty * 1e9;
let ltcDay=0, dogeDay=0;
if (wtm.ltc && wtm.ltc.nethash > 0) {
ltcDay = (hashHS * 86400 * wtm.ltc.block_reward) / (wtm.ltc.nethash * wtm.ltc.block_time);
}
if (wtm.doge && wtm.doge.nethash > 0) {
dogeDay = (hashHS * 86400 * wtm.doge.block_reward) / (wtm.doge.nethash * wtm.doge.block_time);
}
coinDay = ltcDay;
revenue = (ltcDay*ltcP + dogeDay*dogeP) * (1-pool/100) * (upt/100);
}

const pDay = revenue - eCost;
const capex = m.price*qty + infra;
const be = pDay>0 ? capex/pDay : Infinity;
const roi = capex>0 ? (pDay*365/capex)*100 : 0;
return {coinDay, revenue, eCost, pDay, pMo:pDay*30, capex, be, roi, pwrKW};
}

padding:'9px 11px',color:TX,fontSize:14,boxSizing:'border-box',outline:'none',
direction:dir};
const L={fontSize:11,color:DM,textTransform:'uppercase',letterSpacing:.5,
marginBottom:4,display:'block',textAlign:ar?'right':'left'};
const G2={display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10};

const secAgo=lastUp?Math.floor((new Date()-lastUp)/1000):null;

return(
<div style={{background:BG,minHeight:'100vh',color:TX,maxWidth:480,margin:'0 auto',
paddingBottom:56,direction:dir,boxShadow:'0 0 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03)'}}>

  {/* HEADER */}
  <div style={{background:'#111',padding:'13px 14px 0',borderBottom:`1px solid ${BR}`,
    position:'sticky',top:0,zIndex:10}}>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
      <span style={{fontSize:19,fontWeight:800,color:'#fff'}}>⛏ {t.app}</span>
      <div style={{marginLeft:ar?0:'auto',marginRight:ar?'auto':0,display:'flex',gap:6,alignItems:'center'}}>
        <Tog active={ar} onClick={()=>setLang(l=>l==='en'?'ar':'en')} label={ar?'EN':'AR'}/>
        <Tog active={cur==='sar'} onClick={()=>setCur(c=>c==='usd'?'sar':'usd')} label={cur==='usd'?'SAR':'USD'}/>
        <button onClick={()=>isAdmin?setIsAdmin(false):setShowLogin(true)}
          style={{background:'transparent',border:'none',cursor:'pointer',fontSize:16}}>
          {isAdmin?'🔓':'🔒'}
        </button>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:13,fontWeight:700,color:AC}}>{sm(btcP)}</div>
          <div style={{fontSize:9,color:liveTag==='🟢'?'#4ade80':'#e05555'}}>
            {liveTag} {liveTag==='🟢'?t.live:t.offline}{secAgo?` · ${secAgo}s ago`:''}
          </div>
        </div>
      </div>
    </div>
    <div style={{display:'flex'}}>
      {t.tabs.filter((_,i)=>i<3||(i===3&&isAdmin)).map((tb,i)=>(
        <div key={i} onClick={()=>setTab(i)} style={{flex:1,padding:'8px 2px',
          textAlign:'center',fontSize:11,fontWeight:700,cursor:'pointer',
          borderBottom:`2px solid ${tab===i?AC:'transparent'}`,color:tab===i?AC:DM}}>
          {tb}
        </div>
      ))}
    </div>
  </div>

  {/* LOGIN MODAL */}
  {showLogin&&(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',
      display:'flex',alignItems:'center',justifyContent:'center',zIndex:100,padding:24}}>
      <div style={{background:CD,borderRadius:16,padding:24,width:'100%',maxWidth:320}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:16,textAlign:'center'}}>
          🔐 Admin Login
        </div>
        <input type="email" placeholder="Email" style={{...I,marginBottom:10}}
          value={loginEmail} onChange={e=>setLoginEmail(e.target.value)}/>
        <input type="password" placeholder="Password" style={{...I,marginBottom:10}}
          value={loginPass} onChange={e=>setLoginPass(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&doLogin()}/>
        {loginErr&&<div style={{color:'#e05555',fontSize:12,marginBottom:10}}>{loginErr}</div>}
        <button onClick={doLogin} style={{width:'100%',background:AC,color:'#000',
          border:'none',borderRadius:8,padding:12,fontSize:14,fontWeight:700,cursor:'pointer',marginBottom:8}}>
          Login
        </button>
        <button onClick={()=>setShowLogin(false)} style={{width:'100%',background:'#333',
          color:TX,border:'none',borderRadius:8,padding:10,fontSize:13,cursor:'pointer'}}>
          Cancel
        </button>
      </div>
    </div>
  )}

  <div style={{padding:'14px 14px 0'}}>

    {/* ══ CALC TAB ══ */}
    {tab===0&&(
      <div>
        <div style={{display:'flex',gap:8,marginBottom:14}}>
          <button onClick={()=>setMode('list')} style={{flex:1,padding:'10px',borderRadius:9,
            fontWeight:700,fontSize:13,cursor:'pointer',border:`1px solid ${mode==='list'?AC:BR}`,
            background:mode==='list'?AC:'#1e1e1e',color:mode==='list'?'#000':DM}}>{t.fromList}</button>
          <button onClick={()=>setMode('custom')} style={{flex:1,padding:'10px',borderRadius:9,
            fontWeight:700,fontSize:13,cursor:'pointer',border:`1px solid ${mode==='custom'?AC:BR}`,
            background:mode==='custom'?AC:'#1e1e1e',color:mode==='custom'?'#000':DM}}>{t.customIn}</button>
        </div>

        {mode==='custom'&&(
          <div style={{background:'#161616',border:`1px solid ${AC}44`,borderRadius:12,padding:14,marginBottom:12}}>
            <div style={{fontSize:11,color:AC,fontWeight:700,textTransform:'uppercase',marginBottom:12}}>{t.enterSpecs}</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
              <div><span style={L}>TH/s</span>
                <input type="number" style={I} value={custTH} min={1} onChange={e=>setCustTH(+e.target.value)}/></div>
              <div><span style={L}>kW</span>
                <input type="number" style={I} value={custKW} step={0.1} onChange={e=>setCustKW(+e.target.value)}/></div>
              <div><span style={L}>{ar?'السعر $':'Price $'}</span>
                <input type="number" style={I} value={custPrc} onChange={e=>setCustPrc(+e.target.value)}/></div>
            </div>
            {custTH>0&&custKW>0&&(
              <div style={{marginTop:10,display:'flex',gap:8}}>
                <span style={{background:'#f7931a18',color:AC,borderRadius:6,padding:'3px 10px',fontSize:12,fontWeight:700}}>
                  {((custKW*1000)/custTH).toFixed(1)} J/TH
                </span>
                <span style={{background:'#ffffff0d',color:DM,borderRadius:6,padding:'3px 10px',fontSize:12}}>
                  {custTH} TH/s · {custKW} kW
                </span>
              </div>
            )}
          </div>
        )}

        {mode==='list'&&(
          <div>
            <div style={G2}>
              <div><span style={L}>{t.brand}</span>
                <select style={{...I,cursor:'pointer'}} value={bflt} onChange={e=>setBflt(e.target.value)}>
                  {brands.map(b=><option key={b}>{b}</option>)}
                </select></div>
              <div><span style={L}>{t.coin}</span>
                <select style={{...I,cursor:'pointer'}} value={aflt} onChange={e=>setAflt(e.target.value)}>
                  <option value="All">{t.all}</option><option>BTC</option><option>LTC</option>
                </select></div>
            </div>
            <div style={{marginBottom:10}}>
              <span style={L}>{t.model}</span>
              <select style={{...I,cursor:'pointer'}} value={selId}
                onChange={e=>{setSelId(+e.target.value);setMPrc(null);}}>
                {filt.map(m=>(
                  <option key={m.id} value={m.id}>
                    {m.brand} {m.model} · {m.eff} J/{m.unit} · {m.cooling}
                  </option>
                ))}
              </select>
            </div>
            {miner&&(
              <div style={{background:'#161616',borderRadius:8,padding:'8px 12px',marginBottom:10,
                display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                <span style={{background:COOL[miner.cooling]+'22',color:COOL[miner.cooling],
                  borderRadius:5,padding:'2px 8px',fontSize:11,fontWeight:700}}>{miner.cooling}</span>
                <span style={{fontSize:12,color:'#fff',fontWeight:700}}>{miner.hashrate} {miner.unit}/s</span>
                <span style={{fontSize:12,color:DM}}>{miner.watts}W</span>
                <span style={{fontSize:12,color:AC,fontWeight:700}}>{miner.eff} J/TH</span>
                <span style={{marginLeft:ar?0:'auto',fontSize:12,color:DM}}>{miner.algo}</span>
              </div>
            )}
          </div>
        )}

        <div style={G2}>
          <div><span style={L}>{t.qty}</span>
            <input type="number" style={I} value={qty} min={1} onChange={e=>setQty(+e.target.value)}/></div>
          {mode==='list'&&<div><span style={L}>{t.price}</span>
            <input type="number" style={I} value={effPrc} onChange={e=>setMPrc(+e.target.value)}/></div>}
          {mode==='custom'&&<div><span style={L}>{t.infra}</span>
            <input type="number" style={I} value={infra} onChange={e=>setInfra(+e.target.value)}/></div>}
          <div><span style={L}>{t.elec}</span>
            <input type="number" style={I} value={elec} step={0.005} onChange={e=>setElec(+e.target.value)}/></div>
          <div><span style={L}>{isLTC?'LTC':'BTC'} Price $</span>
            <input type="number" style={I} value={isLTC?ltcP:btcP}
              onChange={e=>isLTC?setLtcP(+e.target.value):setBtcP(+e.target.value)}/></div>
          <div><span style={L}>{t.pool}</span>
            <input type="number" style={I} value={pool} step={0.1} onChange={e=>setPool(+e.target.value)}/></div>
          {mode==='list'&&<div><span style={L}>{t.infra}</span>
            <input type="number" style={I} value={infra} onChange={e=>setInfra(+e.target.value)}/></div>}
        </div>

        <div style={{marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
            <span style={{...L,marginBottom:0}}>{t.uptime}</span>
            <span style={{fontSize:13,fontWeight:700,color:AC}}>{upt}%</span>
          </div>
          <input type="range" style={{accentColor:AC}} min={50} max={100}
            value={upt} onChange={e=>setUpt(+e.target.value)}/>
        </div>

        {res&&(
          <div>
            <div style={{background:res.pDay>=0?'#f7931a11':'#e0555511',
              border:`1px solid ${res.pDay>=0?'#f7931a44':'#e0555544'}`,
              borderRadius:14,padding:16,marginBottom:10}}>
              <div style={{fontSize:11,color:DM,textTransform:'uppercase',letterSpacing:.5}}>{t.profit}</div>
              <div style={{fontSize:32,fontWeight:800,color:res.pDay>=0?AC:'#e05555',lineHeight:1.1}}>
                {sm(res.pDay,2)}
              </div>
              <div style={{fontSize:12,color:DM,marginTop:4}}>
                {fmtC(res.coinDay)} {miner.algo}{t.day} · {sm(res.revenue,2)} {t.gross}
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
              <SC label={t.moPro}    value={sm(res.pMo,0)}           color={res.pMo>=0?AC:'#e05555'}/>
              <SC label={t.be}       value={res.be===Infinity?'∞':`${fmt(res.be,0)} ${t.days}`}/>
              <SC label={t.roi}      value={`${fmt(res.roi,1)}%`}     color={res.roi>0?AC:'#e05555'}/>
              <SC label={t.capex}    value={sm(res.capex,0)}/>
              <SC label={t.eCost}    value={sm(res.eCost,2)}          color="#888"/>
              <SC label={t.pwr}      value={`${fmt(res.pwrKW,2)} kW`} color="#aaa"/>
            </div>
            {chart&&(
              <div style={{background:CD,border:`1px solid ${BR}`,borderRadius:12,
                padding:'12px 8px 8px',marginBottom:12}}>
                <div style={{fontSize:11,color:DM,textTransform:'uppercase',letterSpacing:.5,
                  marginBottom:8,paddingLeft:6}}>{t.chart}</div>
                <div style={{overflowX:'auto'}}>
                  <svg width={chart.W} height={chart.H} style={{display:'block'}}>
                    <defs>
                      <linearGradient id="gU" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor={AC} stopOpacity=".35"/>
                        <stop offset="100%" stopColor={AC} stopOpacity=".02"/>
                      </linearGradient>
                      <linearGradient id="gD" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#e05555" stopOpacity=".02"/>
                        <stop offset="100%" stopColor="#e05555" stopOpacity=".3"/>
                      </linearGradient>
                    </defs>
                    <line x1={chart.pl} y1={chart.z} x2={chart.W-chart.pr} y2={chart.z}
                      stroke="#444" strokeWidth="1" strokeDasharray="4,3"/>
                    <polygon points={chart.fill} fill={res.pDay>=0?'url(#gU)':'url(#gD)'}/>
                    <polyline points={chart.line} fill="none"
                      stroke={res.pDay>=0?AC:'#e05555'} strokeWidth="2.5"/>
                    {chart.beX&&<line x1={chart.beX} y1={chart.pt} x2={chart.beX}
                      y2={chart.H-chart.pb} stroke="#4ade80" strokeWidth="1.5" strokeDasharray="3,3"/>}
                    <text x={chart.pl} y={chart.H-4} fill={DM} fontSize="9">0</text>
                    <text x={chart.W-chart.pr} y={chart.H-4} fill={DM} fontSize="9" textAnchor="end">365d</text>
                    <text x={chart.pl-2} y={chart.pt+8} fill={DM} fontSize="9" textAnchor="end">{sm(chart.yMx,0)}</text>
                  </svg>
                </div>
                {chart.beX&&<div style={{fontSize:11,color:'#4ade80',textAlign:'center',marginTop:2}}>
                  ● {t.beAt} {fmt(chart.be,0)} {t.days}
                </div>}
              </div>
            )}
          </div>
        )}
      </div>
    )}

    {/* ══ BEST TAB ══ */}
    {tab===1&&(
      <div>
        <div style={{fontSize:13,fontWeight:700,color:DM,textTransform:'uppercase',
          letterSpacing:1,marginBottom:12}}>{t.bestTitle}</div>
        <div style={G2}>
          <div><span style={L}>{t.budget}</span>
            <input type="number" style={I} value={budget} onChange={e=>setBudget(+e.target.value)}/></div>
          <div><span style={L}>{t.elec}</span>
            <input type="number" style={I} value={rElec} step={0.005} onChange={e=>setRElec(+e.target.value)}/></div>
        </div>
        <div style={{marginBottom:14}}>
          <span style={L}>BTC Price $</span>
          <input type="number" style={I} value={btcP} onChange={e=>setBtcP(+e.target.value)}/>
        </div>
        {recs.map((m,i)=>{
          const pos=m.pDay>0;
          return(
            <div key={m.id} style={{background:CD,border:`1px solid ${i===0?AC:BR}`,
              borderRadius:12,padding:14,marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:20,fontWeight:800,color:i===0?AC:DM}}>#{i+1}</span>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:'#fff'}}>{m.brand} {m.model}</div>
                    <div style={{fontSize:11,color:DM}}>{m.q} {t.units} · {m.cooling} · {m.eff} J/TH</div>
                  </div>
                </div>
                <span style={{background:pos?'#f7931a22':'#e0555522',color:pos?AC:'#e05555',
                  borderRadius:6,padding:'3px 9px',fontSize:12,fontWeight:700}}>
                  {fmt(m.roi,1)}%
                </span>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>
                <SC label={ar?'يومي':'Daily'} value={sm(m.pDay,2)} color={pos?AC:'#e05555'}/>
                <SC label={t.be} value={m.be===Infinity?'∞':`${fmt(m.be,0)}d`}/>
                <SC label={t.pwr} value={`${fmt(m.pwrKW,1)} kW`} color="#aaa"/>
              </div>
            </div>
          );
        })}
      </div>
    )}

    {/* ══ COMPARE TAB ══ */}
    {tab===2&&(
      <div>
        <div style={{fontSize:13,fontWeight:700,color:DM,textTransform:'uppercase',
          letterSpacing:1,marginBottom:12}}>{t.cmpTitle}</div>
        <div style={{background:'#161616',borderRadius:8,padding:'8px 12px',
          marginBottom:14,fontSize:12,color:DM}}>
          {t.using} {qty} {t.units} · ${elec}/kWh · {sm(btcP)}
        </div>
        {cmpIds.map((cid,i)=>{
          const cm=allM.find(m=>m.id===cid);
          const cr=cm?doCalc(cm,qty,elec,prices,wtm,pool,upt,0):null;
          return(
            <div key={i} style={{background:CD,border:`1px solid ${BR}`,borderRadius:12,padding:14,marginBottom:10}}>
              <span style={L}>{t.miner} {i+1}</span>
              <select style={{...I,cursor:'pointer',marginBottom:10}} value={cid}
                onChange={e=>{const n=[...cmpIds];n[i]=+e.target.value;setCmpIds(n);}}>
                {allM.map(m=>(
                  <option key={m.id} value={m.id}>{m.brand} {m.model} ({m.algo})</option>
                ))}
              </select>
              {cr&&cm&&(
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
                  <SC label={ar?'يومي':'Daily'} value={sm(cr.pDay,2)} color={cr.pDay>=0?AC:'#e05555'}/>
                  <SC label={t.roi} value={`${fmt(cr.roi,1)}%`} color={cr.roi>=0?AC:'#e05555'}/>
                  <SC label={t.be} value={cr.be===Infinity?'∞':`${fmt(cr.be,0)}d`}/>
                  <SC label="J/TH" value={`${cm.eff} J/TH`} color="#aaa"/>
                  <SC label={t.moPro} value={sm(cr.pMo,0)} color={cr.pMo>=0?AC:'#e05555'}/>
                  <SC label={t.pwr} value={`${fmt(cr.pwrKW,1)} kW`} color="#aaa"/>
                </div>
              )}
            </div>
          );
        })}
      </div>
    )}

    {/* ══ ADMIN TAB ══ */}
    {tab===3&&isAdmin&&(
      <div>
        <div style={{fontSize:13,fontWeight:700,color:DM,textTransform:'uppercase',
          letterSpacing:1,marginBottom:14}}>{t.adminTitle}</div>

        {deleted.length>0&&(
          <button onClick={()=>saveDel([])} style={{width:'100%',background:'#1a3a1a',
            color:'#4ade80',border:'1px solid #4ade8044',borderRadius:10,padding:'10px',
            fontSize:13,fontWeight:700,cursor:'pointer',marginBottom:10}}>
            🔄 Restore All ({deleted.length})
          </button>
        )}

        <button onClick={()=>setShowForm(v=>!v)} style={{width:'100%',
          background:showForm?'#2a2a2a':AC,color:showForm?TX:'#000',
          border:`1px solid ${showForm?BR:AC}`,borderRadius:10,padding:'12px',
          fontSize:14,fontWeight:700,cursor:'pointer',marginBottom:14}}>
          {showForm?'✕ Cancel':`+ ${t.addTitle}`}
        </button>

        {showForm&&(
          <div style={{background:CD,border:`1px solid ${AC}55`,borderRadius:12,padding:14,marginBottom:16}}>
            <div style={G2}>
              {[['Brand','brand','text'],['Model','model','text'],['Hashrate','hashrate','number'],
                ['Watts','watts','number'],['Price $','price','number']].map(([lb,key,type])=>(
                <div key={key}><span style={L}>{lb}</span>
                  <input type={type} style={I} value={form[key]}
                    onChange={e=>setForm(p=>({...p,[key]:e.target.value}))}/></div>
              ))}
              <div><span style={L}>Algo</span>
                <select style={{...I,cursor:'pointer'}} value={form.algo}
                  onChange={e=>setForm(p=>({...p,algo:e.target.value}))}>
                  <option>BTC</option><option>LTC</option>
                </select></div>
              <div><span style={L}>Unit</span>
                <select style={{...I,cursor:'pointer'}} value={form.unit}
                  onChange={e=>setForm(p=>({...p,unit:e.target.value}))}>
                  <option>TH</option><option>GH</option>
                </select></div>
              <div style={{gridColumn:'1/-1'}}><span style={L}>Cooling</span>
                <select style={{...I,cursor:'pointer'}} value={form.cooling}
                  onChange={e=>setForm(p=>({...p,cooling:e.target.value}))}>
                  <option>Air</option><option>Hydro</option><option>Immersion</option>
                </select></div>
            </div>
            <button onClick={addMiner} style={{width:'100%',background:AC,color:'#000',
              border:'none',borderRadius:8,padding:'11px',fontSize:14,fontWeight:700,cursor:'pointer'}}>
              ✓ {t.addBtn}
            </button>
          </div>
        )}

        {customs.length>0&&(
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:AC,marginBottom:8,
              textTransform:'uppercase',letterSpacing:.5}}>★ {t.customList}</div>
            {customs.map(m=>(
              <div key={m.id} style={{background:'#161616',border:`1px solid ${AC}44`,
                borderRadius:10,padding:'10px 12px',marginBottom:6,
                display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:'#fff'}}>{m.brand} {m.model}</div>
                  <div style={{fontSize:11,color:DM}}>{m.algo} · {m.hashrate} {m.unit}/s · {m.watts}W</div>
                  <div style={{fontSize:12,color:AC,fontWeight:700}}>${fmt(m.price,0)}</div>
                </div>
                <button onClick={()=>saveCust(customs.filter(x=>x.id!==m.id))}
                  style={{background:'#e0555522',color:'#e05555',border:`1px solid #e0555544`,
                  borderRadius:6,padding:'5px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}}>
                  {t.del}
                </button>
              </div>
            ))}
          </div>
        )}

        <div style={{fontSize:11,fontWeight:700,color:DM,marginBottom:8,
          textTransform:'uppercase',letterSpacing:.5}}>
          {t.baseList} ({BASE_MINERS.length - deleted.length})
        </div>
        {BASE_MINERS.map(m=>{
          const isDel=deleted.includes(m.id);
          const curP=overrides[m.id]??m.price;
          const curW=wOvr[m.id]??m.watts;
          const isEP=editId===m.id;
          const isEW=editWId===m.id;
          return(
            <div key={m.id} style={{background:isDel?'#1a0a0a':CD,
              border:`1px solid ${isDel?'#e0555533':BR}`,borderRadius:8,
              padding:'8px 12px',marginBottom:5,opacity:isDel?0.5:1}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:'#fff',
                    whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                    {m.brand} {m.model}
                  </div>
                  <div style={{fontSize:10,color:DM}}>{m.algo} · {m.cooling} · {curW}W · {m.eff} J/TH</div>
                </div>
                <button onClick={()=>isDel?saveDel(deleted.filter(x=>x!==m.id)):saveDel([...deleted,m.id])}
                  style={{background:isDel?'#1a3a1a':'#e0555511',
                    color:isDel?'#4ade80':'#e05555',
                    border:`1px solid ${isDel?'#4ade8033':'#e0555533'}`,
                    borderRadius:5,padding:'3px 7px',fontSize:10,cursor:'pointer',whiteSpace:'nowrap'}}>
                  {isDel?'↩':'🗑'}
                </button>
              </div>

              {!isDel&&(
                <div style={{display:'flex',gap:6,marginTop:6,flexWrap:'wrap'}}>
                  {/* Edit Price */}
                  {isEP?(
                    <div style={{display:'flex',gap:4,alignItems:'center'}}>
                      <input type="number" autoFocus
                        style={{...I,width:80,padding:'4px 7px',fontSize:12}}
                        value={editVal} onChange={e=>setEditVal(e.target.value)}/>
                      <button onClick={()=>{const v=+editVal;if(v>=0)saveOvr({...overrides,[m.id]:v});setEditId(null);}}
                        style={{background:AC,color:'#000',border:'none',borderRadius:5,
                        padding:'4px 8px',fontSize:11,fontWeight:700,cursor:'pointer'}}>✓</button>
                      <button onClick={()=>setEditId(null)}
                        style={{background:'#333',color:TX,border:'none',borderRadius:5,
                        padding:'4px 8px',fontSize:11,cursor:'pointer'}}>✕</button>
                    </div>
                  ):(
                    <button onClick={()=>{setEditId(m.id);setEditVal(String(curP));}}
                      style={{background:'#f7931a18',color:AC,border:`1px solid ${AC}33`,
                      borderRadius:5,padding:'4px 8px',fontSize:10,fontWeight:700,cursor:'pointer'}}>
                      ${fmt(curP,0)} {t.editP}
                    </button>
                  )}

                  {/* Edit Watts */}
                  {isEW?(
                    <div style={{display:'flex',gap:4,alignItems:'center'}}>
                      <input type="number" autoFocus
                        style={{...I,width:80,padding:'4px 7px',fontSize:12}}
                        value={editWVal} onChange={e=>setEditWVal(e.target.value)}/>
                      <button onClick={()=>{const v=+editWVal;if(v>0)saveWOvr({...wOvr,[m.id]:v});setEditWId(null);}}
                        style={{background:'#06b6d4',color:'#000',border:'none',borderRadius:5,
                        padding:'4px 8px',fontSize:11,fontWeight:700,cursor:'pointer'}}>✓</button>
                      <button onClick={()=>setEditWId(null)}
                        style={{background:'#333',color:TX,border:'none',borderRadius:5,
                        padding:'4px 8px',fontSize:11,cursor:'pointer'}}>✕</button>
                    </div>
                  ):(
                    <button onClick={()=>{setEditWId(m.id);setEditWVal(String(curW));}}
                      style={{background:'#06b6d418',color:'#06b6d4',border:'1px solid #06b6d433',
                      borderRadius:5,padding:'4px 8px',fontSize:10,fontWeight:700,cursor:'pointer'}}>
                      {curW}W {t.editW}
                    </button>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    )}

  </div>
</div>

);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
